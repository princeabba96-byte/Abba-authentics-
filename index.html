<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketplace</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0}
header{background:linear-gradient(90deg,#D4AF37,#000);padding:15px;display:flex;justify-content:space-around;position:sticky;top:0}
header button{background:0;border:0;color:#D4AF37;font-weight:bold;font-size:16px;padding:10px}
.product-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:15px}
.product{background:#111;border:2px solid #D4AF37;border-radius:10px;padding:5px;text-align:center}
.product img{width:100%;height:120px;object-fit:cover;border-radius:8px}
.card{margin:15px;padding:15px;background:#111;border:2px solid #D4AF37;border-radius:10px}
input,textarea{width:95%;padding:12px;margin:8px 0;background:#222;border:1px solid #D4AF37;border-radius:8px;color:#fff}
.btn{width:95%;padding:14px;margin:8px 0;background:#D4AF37;color:#000;border:0;border-radius:8px;font-weight:bold;font-size:16px}
#preview{width:95%;height:150px;object-fit:cover;border:2px dashed #D4AF37;border-radius:10px;margin:8px 0;display:none}
h2{color:#D4AF37;text-align:center}
</style>
</head>
<body>
<header>
<button onclick="tab('home')">HOME</button>
<button onclick="tab('search')">SEARCH</button>
<button onclick="tab('account')">ACCOUNT</button>
<button onclick="tab('post')">POST</button>
</header>

<div id="home"><h2>MARKETPLACE</h2><div class="product-grid" id="pGrid"></div></div>

<div id="search" style="display:none"><h2>SEARCH</h2><div class="card"><input id="s" placeholder="What you dey find?"><button class="btn" onclick="search()">Search</button></div><div class="product-grid" id="sGrid"></div></div>

<div id="account" style="display:none"><h2>LOGIN WITH OTP</h2><div class="card">
<input id="phone" placeholder="Phone Number">
<button class="btn" onclick="otp()">SEND OTP</button>
<p id="otpshow" style="color:#D4AF37;font-size:28px;text-align:center;font-weight:bold"></p>
<div style="display:flex;gap:5px;justify-content:center"><input id="o1" maxlength="1" size="1"><input id="o2" maxlength="1" size="1"><input id="o3" maxlength="1" size="1"><input id="o4" maxlength="1" size="1"></div>
<button class="btn" onclick="check()">VERIFY & LOGIN</button>
</div></div>

<div id="post" style="display:none"><h2>ADMIN POST</h2>
<div class="card" id="loginBox">
<input type="password" id="adminPass" placeholder="Enter Admin Password">
<button class="btn" onclick="adminLogin()">LOGIN AS ADMIN</button>
</div>
<div class="card" id="postBox" style="display:none">
<input id="n" placeholder="Product Name">
<input id="pr" placeholder="Price ₦">
<textarea id="de" placeholder="Description"></textarea>
<p style="color:#D4AF37">Upload Product Image:</p>
<input type="file" id="img" accept="image/*" onchange="showimg(event)">
<img id="preview">
<input id="wa" placeholder="Your WhatsApp Number">
<button class="btn" onclick="save()">POST NOW</button>
<button class="btn" style="background:#555" onclick="logout()">LOGOUT</button>
</div>
</div>

<script>
let pro=JSON.parse(localStorage.getItem('pro'))||[];let code=0;let im="";const ADMIN="abba123";

function tab(x){home.style.display=search.style.display=account.style.display=post.style.display='none';document.getElementById(x).style.display='block';load()}

function adminLogin(){if(adminPass.value==ADMIN){loginBox.style.display='none';postBox.style.display='block'}else alert('Wrong Admin Password')}

function logout(){loginBox.style.display='block';postBox.style.display='none';adminPass.value=""}

function showimg(e){let r=new FileReader();r.onload=()=>{im=r.result;preview.src=im;preview.style.display='block'};r.readAsDataURL(e.target.files[0])}

function save(){if(!n.value||!pr.value||!wa.value||!im)return alert('Fill all + Upload Image');pro.push({n:n.value,pr:pr.value,de:de.value,wa:wa.value,i:im});localStorage.setItem('pro',JSON.stringify(pro));alert('Product Posted!');n.value=pr.value=de.value=wa.value="";preview.src="";preview.style.display='none';im="";tab('home')}

function load(){pGrid.innerHTML='';if(pro.length==0)pGrid.innerHTML='<p style=color:#D4AF37;text-align:center>Go to POST to add products</p>';pro.slice().reverse().forEach(x=>pGrid.innerHTML+=`<div class=product><img src="${x.i}"><h4 style=color:#D4AF37>${x.n}</h4><p>₦${x.pr}</p><a href=https://wa.me/${x.wa} style=color:#D4AF37>WhatsApp</a></div>`)}

function otp(){code=Math.floor(1000+Math.random()*9000);otpshow.innerText=code;alert('Your OTP: '+code)}

function check(){if(o1.value+o2.value+o3.value+o4.value==code)alert('Login Success');else alert('Wrong OTP')}

function search(){let v=s.value.toLowerCase();sGrid.innerHTML='';pro.filter(x=>x.n.toLowerCase().includes(v)).forEach(x=>sGrid.innerHTML+=`<div class=product><img src="${x.i}"><h4 style=color:#D4AF37>${x.n}</h4><p>₦${x.pr}</p></div>`)}
load()
</script>
</body>
</html>
