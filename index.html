<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABBA AUTHENTICS</title>
</head>

<body>

<h1>ABBA AUTHENTICS</h1>

<h2>HOME</h2>

<p>Welcome to ABBA AUTHENTICS.</p>

<button onclick="alert('HOME WORKS')">
HOME TEST
</button>
<script>
const SUPABASE_URL = "https://eoccjsybttiwcxfaxeqg.supabase.co";
const SUPABASE_KEY = "sb_publishable_AARFSH7pm5iQIatNs5HKZg_qGqvHFE6";
const ADMIN_EMAIL = "princeabba96@gmail.com";

let currentUser = null;

function isAdmin() {
  return currentUser &&
    currentUser.email &&
    currentUser.email.toLowerCase() === ADMIN_EMAIL;
}

async function checkLogin() {

  if (typeof supabase === "undefined") {
    console.log("Supabase library not connected yet.");
    return;
  }

  const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const result = await client.auth.getSession();

  if (result.data.session) {
    currentUser = result.data.session.user;
    console.log("Logged in:", currentUser.email);

    if (isAdmin()) {
      console.log("ADMIN ACCOUNT");
    } else {
      console.log("CUSTOMER ACCOUNT");
    }
  } else {
    currentUser = null;
    console.log("Not logged in");
  }
}

checkLogin();
</script><div id="loginBox" style="
max-width:400px;
margin:30px auto;
padding:20px;
background:#121212;
border:1px solid #333;
border-radius:15px;
color:white;
">

<h2>👤 Account Login</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
style="
width:100%;
padding:12px;
margin:10px 0;
background:#080808;
color:white;
border:1px solid #444;
border-radius:8px;
">

<input
id="loginPassword"
type="password"
placeholder="Password"
style="
width:100%;
padding:12px;
margin:10px 0;
background:#080808;
color:white;
border:1px solid #444;
border-radius:8px;
">

<button
onclick="loginUser()"
style="
width:100%;
padding:12px;
background:#d4af37;
border:0;
border-radius:8px;
font-weight:bold;
">
LOGIN
</button>

<p id="loginMessage" style="margin-top:12px;"></p>

</div>

<script>
async function loginUser(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  if(!email || !password){
    message.textContent =
      "Please enter your email and password.";
    return;
  }

  if(typeof supabase === "undefined"){
    message.textContent =
      "Supabase is not loaded yet.";
    return;
  }

  const client =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const result =
    await client.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(result.error){

    message.textContent =
      "Login failed: " +
      result.error.message;

    return;
  }

  currentUser =
    result.data.user;

  if(isAdmin()){

    message.textContent =
      "✅ Admin login successful!";

  }else{

    message.textContent =
      "✅ Customer login successful!";

  }

}
</script>
</body>
</html>
