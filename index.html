document.getElementById("showSignup").onclick = function() {

/* SIGN IN */

document.getElementById("loginBtn").onclick = async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMsg");

  msg.textContent = "Signing in...";


  const { data, error } =
    await db.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    msg.textContent =
      "Invalid login credentials.";

    msg.style.color = "red";

    return;

  }


  currentUser = data.user;

  document.getElementById("auth").classList.add("hidden");

  document.getElementById("signup").classList.add("hidden");

  document.getElementById("home").classList.remove("hidden");

  loadProfile();

};


/* SIGN UP */

document.getElementById("signupBtn").onclick = async function() {

  const name =
    document.getElementById("name").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const type =
    document.getElementById("accountType").value;

  const whatsapp =
    document.getElementById("whatsapp").value.trim();

  const msg =
    document.getElementById("signupMsg");

  msg.textContent = "Creating account...";


  const { data, error } =
    await db.auth.signUp({

      email: email,

      password: password

    });


  if (error) {

    msg.textContent = error.message;

    msg.style.color = "red";

    return;

  }


  const user = data.user;


  await db
    .from("profiles")
    .insert({

      id: user.id,

      email: email,

      display_name: name,

      account_type: type,

      whatsapp: whatsapp,

      is_verified_seller: false

    });


  msg.textContent =
    "Account created. Please sign in.";

  msg.style.color = "green";

};

    </script>
    <script>

async function loadProfile() {

  if (!currentUser) return;


  const { data, error } =
    await db
      .from("profiles")
      .select("*")
      .eq("id", currentUser.id)
      .single();


  if (error) {

    console.log(error);

    return;

  }


  currentProfile = data;


  document.getElementById("profileName")
    .textContent =
    data.display_name || "User";


  document.getElementById("accountName")
    .textContent =
    data.display_name || "User";


  document.getElementById("accountEmail")
    .textContent =
    data.email || currentUser.email;


  document.getElementById("accountWhatsapp")
    .textContent =
    data.whatsapp || "No WhatsApp number";


  document.getElementById("accountType")
    .textContent =
    data.account_type || "Customer";


  /* PROFILE PHOTO */

  if (data.profile_picture) {

    document.getElementById("profilePhoto")
      .src =
      data.profile_picture;

    document.getElementById("accountPhoto")
      .src =
      data.profile_picture;

  }


  /* VERIFIED SELLER */

  if (
    data.is_verified_seller === true
  ) {

    document.getElementById("verifiedSeller")
      .classList.remove("hidden");

  }

}

    </script>

    <script>

async function loadProducts() {

  const box =
    document.getElementById("products");


  box.innerHTML =
    "<p>Loading products...</p>";


  const { data, error } =
    await db
      .from("products")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    box.innerHTML =
      "<p>Could not load products.</p>";

    console.log(error);

    return;

  }


  if (!data || data.length === 0) {

    box.innerHTML =
      "<p>No products yet.</p>";

    return;

  }


  box.innerHTML = "";


  data.forEach(function(product) {

    const item =
      document.createElement("div");


    item.style.padding = "15px";

    item.style.margin = "10px 0";

    item.style.background = "white";

    item.style.borderRadius = "15px";

    item.style.boxShadow =
      "0 3px 12px rgba(0,0,0,.10)";


    item.innerHTML = `

      <h3>${product.name || "Product"}</h3>

      <p>
        ${product.authenticated
          ? "🟢 ✓ AUTHENTICATED"
          : "🟡 Pending authentication"}
      </p>

    `;


    box.appendChild(item);

  });

}


loadProducts();

    </script>

      <script>

async function uploadProductImage() {

  const file =
    document.getElementById("productImage").files[0];

  if (!file) return null;


  const fileName =
    Date.now() + "-" + file.name;


  const { error } =
    await db.storage
      .from("product-images")
      .upload(fileName, file);


  if (error) {

    console.log(error);

    return null;

  }


  const { data } =
    db.storage
      .from("product-images")
      .getPublicUrl(fileName);


  return data.publicUrl;

}

      <script>

async function showProductDetails(product) {

  let seller = null;


  if (product.seller_id) {

    const { data } =
      await db
        .from("profiles")
        .select("*")
        .eq("id", product.seller_id)
        .single();

    seller = data;

  }


  const sellerName =
    seller?.display_name || "Seller";


  const sellerPhoto =
    seller?.profile_picture || "";


  const whatsapp =
    product.seller_whatsapp ||
    seller?.whatsapp ||
    "";


  const box =
    document.createElement("div");


  box.style.position = "fixed";

  box.style.inset = "0";

  box.style.background = "white";

  box.style.zIndex = "9999";

  box.style.padding = "25px";

  box.style.overflowY = "auto";


  box.innerHTML = `

    <button id="closeProduct">
      ← BACK
    </button>

    <h1>${product.name}</h1>

    ${
      product.image_url
      ? `<img src="${product.image_url}"
          style="width:100%;max-height:350px;
          object-fit:contain;border-radius:15px;">`
      : ""
    }

    <h2>Seller</h2>

    ${
      sellerPhoto
      ? `<img src="${sellerPhoto}"
          width="70" height="70"
          style="border-radius:50%;object-fit:cover;">`
      : ""
    }

    <h3>${sellerName}</h3>

    ${
      seller?.is_verified_seller
      ? `<p style="color:green;font-weight:bold;">
          ✓ VERIFIED SELLER
        </p>`
      : ""
    }

    <p>
      Location:
      ${seller?.location || "Not added"}
    </p>

    <p>
      ${seller?.seller_description || ""}
    </p>

    <button id="contactSeller">
      CONTACT SELLER
    </button>

  `;


  document.body.appendChild(box);


  document.getElementById("closeProduct")
    .onclick = function() {

      box.remove();

    };


  document.getElementById("contactSeller")
    .onclick = function() {

      if (!whatsapp) {

        alert("Seller has no WhatsApp number.");

        return;

      }


      let number =
        whatsapp.replace(/\D/g, "");


      if (number.startsWith("0")) {

        number =
          "234" + number.substring(1);

      }


      window.open(
        "https://wa.me/" + number,
        "_blank"
      );

    };

}
