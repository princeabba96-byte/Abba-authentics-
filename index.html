<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abba Authentics - Luxury Verified</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial; background: #0a0a0a; color: #fff; padding-bottom: 40px; }
  
  header { background: linear-gradient(135deg, #000, #D4AF37); padding: 20px; text-align: center; }
  h1 { color: #D4AF37; font-size: 28px; }
  
  nav {
    background: #111;
    padding: 15px;
    display: flex;
    justify-content: flex-start;
    gap: 12px;
    overflow-x: auto;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav button {
    background: #D4AF37;
    color: #000;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  nav button:hover { background: #fff; }
  nav button.active { background: #fff; }
  
  .section { display: none; padding: 20px; }
  .section.active { display: block; }
  
  .card { background: #222; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; }
  input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #333; border: 1px solid #555; color: #fff; border-radius: 5px; }
  .btn { background: #D4AF37; color: #000; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #fff; }
  .stats { display: flex; gap: 15px; flex-wrap: wrap; }
  .stat-box { background: #222; padding: 20px; border-radius: 8px; flex: 1; min-width: 150px; text-align: center; border: 1px solid #D4AF37; }
  .stat-box h3 { color: #D4AF37; font-size: 14px; }
  .stat-box p { font-size: 24px; font-weight: bold; margin-top: 5px; }
</style>
</head>
<body>

<header>
  <h1>ABBA AUTHENTICS</h1>
  <p>Luxury Verified</p>
</header>

<nav>
  <button onclick="showSection('home')" class="active" id="btn-home">Home</button>
  <button onclick="showSection('products')" id="btn-products">Products</button>
  <button onclick="showSection('dashboard')" id="btn-dashboard">Dashboard</button>
  <button onclick="showSection('orders')" id="btn-orders">Orders</button>
  <button onclick="showSection('admin')" id="btn-admin">Admin</button>
</nav>

<div id="home" class="section active">
  <h2>Welcome to Abba Authentics</h2>
  <p>Your number 1 plug for Luxury Verified products.</p>
  <div class="card">
    <h3>Quick Stats</h3>
    <p>Products: <span id="homeProductCount">0</span></p>
    <p>Orders: <span id="homeOrderCount">0</span></p>
  </div>
</div>

<div id="products" class="section">
  <h2>Products</h2>
  <div id="productList"></div>
</div>

<div id="dashboard" class="section">
  <h2>Dashboard</h2>
  <div class="stats">
    <div class="stat-box">
      <h3>Total Revenue</h3>
      <p id="totalRevenue">₦0</p>
    </div>
    <div class="stat-box">
      <h3>Total Orders</h3>
      <p id="totalOrders">0</p>
    </div>
    <div class="stat-box">
      <h3>Total Products</h3>
      <p id="totalProducts">0</p>
    </div>
  </div>
</div>

<div id="orders" class="section">
  <h2>Orders</h2>
  <div id="ordersList"></div>
  
  <div class="card">
    <h3>Add New Order</h3>
    <input type="text" id="orderName" placeholder="Customer Name">
    <input type="number" id="orderPrice" placeholder="Order Amount ₦">
    <button class="btn" onclick="addOrder()">Add Order</button>
  </div>
</div>

<div id="admin" class="section">
  <h2>Admin Panel</h2>
  <div class="card">
    <h3>Add New Product</h3>
    <input type="text" id="prodName" placeholder="Product Name">
    <input type="number" id="prodPrice" placeholder="Product Price ₦">
    <textarea id="prodDesc" placeholder="Product Description"></textarea>
    <button class="btn" onclick="addProduct()">Add Product</button>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('abba_products')) || [];
let orders = JSON.parse(localStorage.getItem('abba_orders')) || [];

function showSection(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('btn-' + id).classList.add('active');
  loadAll();
}

function saveData() {
  localStorage.setItem('abba_products', JSON.stringify(products));
  localStorage.setItem('abba_orders', JSON.stringify(orders));
}

function addProduct() {
  const name = document.getElementById('prodName').value;
  const price = parseFloat(document.getElementById('prodPrice').value);
  const desc = document.getElementById('prodDesc').value;
  if(!name || !price) return alert('Fill name and price');
  
  products.push({id: Date.now(), name, price, desc});
  saveData();
  document.getElementById('prodName').value = '';
  document.getElementById('prodPrice').value = '';
  document.getElementById('prodDesc').value = '';
  loadAll();
  alert('Product Added!');
}

function addOrder() {
  const name = document.getElementById('orderName').value;
  const price = parseFloat(document.getElementById('orderPrice').value);
  if(!name || !price) return alert('Fill name and amount');
  
  orders.push({id: Date.now(), name, price});
  saveData();
  document.getElementById('orderName').value = '';
  document.getElementById('orderPrice').value = '';
  loadAll();
  alert('Order Added!');
}

function loadAll() {
  const pList = document.getElementById('productList');
  pList.innerHTML = products.length === 0 ? '<p>No products yet. Go to Admin to add.</p>' : '';
  products.forEach(p => {
    pList.innerHTML += `<div class="card"><h3>${p.name}</h3><p>₦${p.price.toLocaleString()}</p><p>${p.desc}</p></div>`;
  });
  
  const oList = document.getElementById('ordersList');
  oList.innerHTML = orders.length === 0 ? '<p>No orders yet.</p>' : '';
  orders.forEach(o => {
    oList.innerHTML += `<div class="card"><h3>${o.name}</h3><p>₦${o.price.toLocaleString()}</p></div>`;
  });
  
  let total = 0;
  orders.forEach(o => total += o.price);
  document.getElementById('totalRevenue').innerText = '₦' + total.toLocaleString();
  document.getElementById('totalOrders').innerText = orders.length;
  document.getElementById('totalProducts').innerText = products.length;
  
  document.getElementById('homeProductCount').innerText = products.length;
  document.getElementById('homeOrderCount').innerText = orders.length;
}

loadAll();
</script>

</body>
</html>
