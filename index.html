j<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #000; color: #fff; }
  header { background: linear-gradient(90deg, #D4AF37, #000); padding: 15px; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 10px rgba(212,175,55,0.3); }
  nav { display: flex; justify-content: space-around; align-items: center; }
  nav a { color: #D4AF37; text-decoration: none; font-weight: bold; font-size: 15px; padding: 8px; }
  nav a.active { border-bottom: 3px solid #D4AF37; }
  .container { padding: 15px; max-width: 600px; margin: auto; }
  .section { display: none; }
  .section.active { display: block; }
  .search-bar { display: flex; gap: 5px; margin: 15px 0; }
  .search-bar input { flex: 1; padding: 12px; border: 2px solid #D4AF37; border-radius: 25px; background: #111; color: #fff; outline: none; }
  .search-bar button { padding: 12px 20px; background: #D4AF37; color: #000; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; }
  .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
  .product { background: #111; border: 2px solid #D4AF37; border-radius: 12px; padding: 8px; text-align: center; transition: 0.3s; }
  .product:hover { transform: scale(1.03); }
  .product img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; background: #222; }
  .product h4 { color: #D4AF37; font-size: 13px; margin: 6px 0; }
  .product p { color: #fff; font-weight: bold; font-size: 14px; }
  .card { background: #111; padding: 20px; border-radius: 12px; border: 2px solid #D4AF37; margin: 15px 0; }
  input, textarea { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #D4AF37; border-radius: 10px; background: #222; color: #fff; outline: none; font-size: 15px; }
  .btn { background: #D4AF37; color: #000; padding: 14px; border: none; border-radius: 10px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
  .btn:hover { background: #FFD700; }
  .otp-box { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
  .otp-box input { width: 55px; height: 55px; text-align: center; font-size: 24px; font-weight: bold; }
  #otpDisplay { background: #D4AF37; color: #000; padding: 15px; border-radius: 10px; text-align: center; font-size: 28px; font-weight: bold; margin: 10px 0; letter-spacing: 5px; }
  h2 { color: #D4AF37; text-align: center; margin-bottom: 15px; }
</style>
</head>
<body>

<header>
  <nav>
    <a href="#" onclick="show('home')" id="nav-home" class="active">HOME</a>
    <a href="#" onclick="show('search')" id="nav-search">SEARCH</a>
    <a href="#" onclick="show('account')" id="nav-account">ACCOUNT</a>
    <a href="#" onclick="show('post')" id="nav-post">POST</a>
  </nav>
</header>

<div class="container">

  <!-- HOME -->
  <div id="home" class="section active">
    <h2>MARKETPLACE</h2>
    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- SEARCH -->
  <div id="search" class="section">
    <h2>SEARCH PRODUCTS</h2>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="What you dey find?">
      <button onclick="search()">Search</button>
    </div>
    <div class="product-grid" id="searchResults"></div>
  </div>

  <!-- ACCOUNT / OTP -->
  <div id="account" class="section">
    <h2>LOGIN WITH OTP</h2>
    <div class="card">
      <input type="tel" id="phone" placeholder="Enter Phone Number">
      <button class="btn" onclick="sendOTP()">SEND OTP</button>
      
      <div id="otpSection" style="display:none;">
        <p style="text-align:center; color:#D4AF37; margin:10px 0;">Your New OTP Code:</p>
        <div id="otpDisplay">0000</div>
        <div class="otp-box">
          <input type="text" id="otp1" maxlength="1" oninput="moveNext(this,'otp2')">
          <input type="text" id="otp2" maxlength="1" oninput="moveNext(this,'otp3')">
          <input type="text" id="otp3" maxlength="1" oninput="moveNext(this,'otp4')">
          <input type="text" id="otp4" maxlength="1">
        </div>
        <input type="password" id="password" placeholder="Set Password">
        <button class="btn" onclick="verifyOTP()">VERIFY & LOGIN</button>
      </div>
    </div>
  </div>

  <!-- POST -->
  <div id="post" class="section">
    <h2>POST PRODUCT</h2>
    <div class="card">
      <input type="text" id="pName" placeholder="Product Name">
      <input type="number" id="pPrice" placeholder="Price ₦">
      <textarea id="pDesc" placeholder="Product Description" rows="3"></textarea>
      <input type="tel" id="pWhatsApp" placeholder="Your WhatsApp Number e.g 23480...">
      <button class="btn" onclick="addProduct()">POST NOW</button>
    </div>
  </div>

</div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [];
let currentOTP = "";

function show(id) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  document.getElementById('nav-' + id).classList.add('active');
  loadProducts();
}

function addProduct() {
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pPrice').value;
  const desc = document.getElementById('pDesc').value;
  const wa = document.getElementById('pWhatsApp').value;
  if(!name || !price || !wa) return alert('Please fill all fields');
  products.push({id: Date.now(), name, price, desc, wa});
  localStorage.setItem('products', JSON.stringify(products));
  alert('Product Posted Successfully!');
  document.getElementById('pName').value = "";
  document.getElementById('pPrice').value = "";
  document.getElementById('pDesc').value = "";
  document.getElementById('pWhatsApp').value = "";
  show('home');
}

function loadProducts() {
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  if(products.length == 0) {
    grid.innerHTML = '<p style="text-align:center; grid-column:1/4; color:#D4AF37;">No products yet. Go to POST to add one.</p>';
  }
  products.slice().reverse().forEach(p => {
    grid.innerHTML += `
      <div class="product">
        <img src="https://via.placeholder.com/150/D4AF37/000?text=${p.name}">
        <h4>${p.name}</h4>
        <p>₦${p.price}</p>
        <a href="https://wa.me/${p.wa}" style="color:#D4AF37; font-size:12px; text-decoration:none;">WhatsApp</a>
      </div>
    `;
  });
}

function search() {
  const val = document.getElementById('searchInput').value.toLowerCase();
  const results = products.filter(p => p.name.toLowerCase().includes(val));
  const grid = document.getElementById('searchResults');
  if(results.length == 0) grid.innerHTML = '<p style="color:#D4AF37;">No product found</p>';
  else grid.innerHTML = results.map(p => `
    <div class="product">
      <img src="https://via.placeholder.com/150/D4AF37/000?text=${p.name}">
      <h4>${p.name}</h4>
      <p>₦${p.price}</p>
    </div>
  `).join('');
}

function sendOTP() {
  const phone = document.getElementById('phone').value;
  if(!phone) return alert('Enter phone number first');
  currentOTP = Math.floor(1000 + Math.random() * 9000); // NEW OTP every time
  document.getElementById('otpDisplay').innerText = currentOTP;
  document.getElementById('otpSection').style.display = 'block';
  alert(`New OTP for ${phone}: ${currentOTP}`);
}

function moveNext(current, nextId) {
  if(current.value.length == 1) document.getElementById(nextId).focus();
}

function verifyOTP() {
  const entered = document.getElementById('otp1').value + document.getElementById('otp2').value + document.getElementById('otp3').value + document.getElementById('otp4').value;
  if(entered == currentOTP) {
    alert('Login Successful!');
    show('home');
  } else {
    alert('Wrong OTP! Click SEND OTP for new code');
  }
}

loadProducts();
</script>

</body>
</html>
